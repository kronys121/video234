<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crysis на консолях</title>
<style>
@font-face{font-family:Mont;font-weight:700;src:url(fonts/montserrat-cyrillic-700-normal.woff2)format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:Mont;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)format('woff2')}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-cyrillic-800-normal.woff2)format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)format('woff2')}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-cyrillic-900-normal.woff2)format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)format('woff2')}
@font-face{font-family:Emoji;src:url(fonts/NotoColorEmoji.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#e9e9e9}
#stage{position:absolute;inset:0;overflow:hidden;background:#e9e9e9;font-family:Mont,Emoji,sans-serif}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.bg{position:absolute;inset:-60px}
.bg.light{background:radial-gradient(ellipse 70% 72% at 50% 46%,#ffffff 0%,#f3f3f3 40%,#d9d9d9 80%,#c7c7c7 100%)}
.bg.dark{background:radial-gradient(ellipse 70% 72% at 50% 46%,#2b2b30 0%,#16161a 60%,#0b0b0d 100%)}
.bgimg{position:absolute;left:60px;top:60px;width:1920px;height:1080px;object-fit:cover}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 65% 70% at 50% 46%,rgba(255,255,255,.55) 0%,rgba(245,245,245,.72) 55%,rgba(225,225,225,.9) 100%)}
.veil.soft{background:radial-gradient(ellipse 60% 62% at 50% 46%,rgba(255,255,255,.38) 0%,rgba(248,248,248,.55) 55%,rgba(235,235,235,.8) 100%)}
.veil.dark{background:radial-gradient(ellipse 70% 75% at 50% 46%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.75) 100%)}
.cam{position:absolute;inset:0}
.it{position:absolute;left:0;top:0}
.card{overflow:hidden;background:#111;box-shadow:0 30px 60px rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.16)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.txt{font-family:Mont,Emoji,sans-serif;line-height:1.08;letter-spacing:-.01em}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .03em .06em}
.w>span{display:inline-block}
.ul{height:.14em;border-radius:.07em;margin-top:.06em;transform-origin:0 50%;transform:scaleX(0)}
.emo{font-family:Emoji;line-height:1}
.icon{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Emoji;border:5px solid #fff;box-shadow:0 12px 24px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:22px;font-family:Mont;font-weight:800;font-size:44px;color:#151515}
.bar .bt{flex:1;height:34px;border-radius:17px;background:rgba(0,0,0,.12);overflow:hidden;border:3px solid rgba(0,0,0,.18)}
.bar .bf{height:100%;width:0;background:linear-gradient(90deg,#e1252d,#ff6a3d);border-radius:17px}
.bar .bp{min-width:120px;text-align:right}
</style></head><body>
<div id="stage"></div>
<script>window.DUR = 635.1;</script>
<svg id="mbsvg" width="0" height="0" style="position:absolute"><defs id="mbdefs"></defs></svg>
<script src="pool.js"></script>
<script src="engine.js"></script>
<script src="beats.js"></script>
<script>
build();
(async () => {
  await document.fonts.load('800 40px Mont'); await document.fonts.load('900 40px Mont'); await document.fonts.load('40px Emoji', '😀');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await window.renderAt(0); window.__ready = true;
})();
</script>
</body></html>
