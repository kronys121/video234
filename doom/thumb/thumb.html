<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-cyrillic-900-normal.woff2') format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#111;font-family:'Mont'}
.bg{position:absolute;inset:0;background:url(/doom/cut/preview_bg.jpg) center/cover;filter:saturate(1.2) contrast(1.05)}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(0,0,0,.05),rgba(0,0,0,.55)),linear-gradient(0deg,rgba(0,0,0,.6),transparent 45%)}
.t{position:absolute;left:0;width:1920px;text-align:center;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1;text-shadow:0 0 40px rgba(0,0,0,.65),0 10px 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.6)}
.ps{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(0 40px 40px rgba(0,0,0,.7))}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="t" id="t" style="top:430px;font-size:230px">НЕВОЗМОЖНО</div>
<img class="ps" id="ps" src="/doom/cut/switch_grey_black.png" style="top:700px;width:880px">
<script>const q=new URLSearchParams(location.search);if(q.get("t"))document.getElementById("t").textContent=q.get("t");if(q.get("ty"))document.getElementById("t").style.top=q.get("ty")+"px";if(q.get("bgy"))document.querySelector(".bg").style.backgroundPosition="center "+q.get("bgy");</script></body></html>
