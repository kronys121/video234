<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-cyrillic-900-normal.woff2') format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07080b;font-family:'Mont'}
.bg{position:absolute;inset:-30px;background:url(/tlou2/thumb/forest.jpg) center/cover;filter:blur(6px) brightness(.55) saturate(1.2)}
.tintL{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,90,110,.55),rgba(20,90,110,0) 50%)}
.tintR{position:absolute;inset:0;background:linear-gradient(270deg,rgba(170,30,20,.6),rgba(170,30,20,0) 50%)}
.f{position:absolute;bottom:0;height:1120px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8)) contrast(1.08) saturate(1.1);-webkit-mask-composite:source-in}
.seam{position:absolute;left:50%;top:-100px;width:14px;height:1300px;background:linear-gradient(180deg,#ff3b2f,#ffb36b,#ff3b2f);transform:translateX(-50%) rotate(8deg);box-shadow:0 0 40px 12px rgba(255,60,40,.7)}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,11,.95) 0%,rgba(7,8,11,.6) 22%,rgba(7,8,11,0) 45%)}
.t{position:absolute;left:0;width:1920px;text-align:center;bottom:50px;font-weight:900;font-size:200px;color:#fff;line-height:1;text-shadow:0 0 50px rgba(0,0,0,.85),0 12px 30px rgba(0,0,0,.8)}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:40px;width:380px;filter:drop-shadow(0 10px 25px rgba(0,0,0,.9))}
.ps4{position:absolute;left:50%;transform:translateX(-50%);bottom:270px;width:620px;filter:drop-shadow(0 0 40px rgba(255,80,40,.6)) drop-shadow(0 25px 30px rgba(0,0,0,.9))}
</style></head><body>
<div class="bg"></div><div class="tintL"></div><div class="tintR"></div>
<div class="seam"></div>
<img class="f" src="/tlou2/thumb/pc_ellie.png" style="left:-90px;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent 99%)">
<img class="f" src="/tlou2/thumb/pc_abby.png" style="right:-80px;-webkit-mask-image:linear-gradient(270deg,#000 80%,transparent 99%)">
<div class="shade"></div>
<img class="ps4" src="/rdr2/assets/ps4_front.png">
<img class="logo" id="logo" src="/tlou2/assets/logo_white.png">
<div class="t" id="t">НЕВОЗМОЖНО</div>
<script>const q=new URLSearchParams(location.search);if(q.get('t'))document.getElementById('t').innerHTML=q.get('t');if(q.get('nologo'))document.getElementById('logo').style.display='none';</script>
</body></html>
