<!doctype html><html><head><meta charset="utf-8"><style>

@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0612;font-family:'Mont'}
/* 4 панели как в превью GTA San Andreas: общий фон, на каждой свой персонаж, тёмные разделители */
.p{position:absolute;top:0;height:1080px;width:474px;overflow:hidden;background:#0b0612}

.ps5{position:absolute;left:50%;transform:translateX(-50%);top:762px;width:770px;filter:drop-shadow(0 0 30px rgba(120,150,255,.55)) drop-shadow(0 30px 40px rgba(0,0,0,.8))}
</style></head><body>
<div class="p" style="left:0px"><div class="bg" style="background-position:-0px 0"></div><img src="/gta6/cut/jason.png" style="top:-10px;width:700px;margin-left:15px"></div>
<div class="p" style="left:482px"><div class="bg" style="background-position:-482px 0"></div><img src="/gta6/cut/boobie.png" style="top:20px;width:760px;margin-left:30px"></div>
<div class="p" style="left:964px"><div class="bg" style="background-position:-964px 0"></div><img src="/gta6/cut/raul.png" style="top:40px;width:740px;margin-left:35px"></div>
