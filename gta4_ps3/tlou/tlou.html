<!doctype html><html><head><meta charset="utf-8"><title>PS3 · The Last of Us</title>
<style>
@font-face{font-family:'Osw';font-weight:700;src:url('/node_modules/@fontsource/oswald/files/oswald-cyrillic-700-normal.woff2') format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Osw';font-weight:700;src:url('/node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Mont';font-weight:900;src:url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#e6e6e8}
body{font-family:'Osw',sans-serif}
#view{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;inset:0;overflow:hidden}
#grid{position:absolute;inset:-40px;background-color:#ececee;background-image:linear-gradient(0deg,rgba(0,0,0,.075) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.075) 2px,transparent 2px)}
#bgs{position:absolute;inset:0;z-index:0}
#bgs>div{position:absolute;inset:-60px;display:none;background-size:cover;background-position:center}
#world{position:absolute;left:0;top:0;transform-origin:0 0;z-index:1}
.o{position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22) 100%)}
.tx{font-weight:700;color:#2a2a2c;white-space:nowrap;letter-spacing:.01em;line-height:1}
.dark .tx{color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.55)}
.tx span{display:inline-block}
.card{border-radius:30px;overflow:hidden;background:#222;box-shadow:0 30px 50px rgba(0,0,0,.30)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.emo{font-family:'Noto Color Emoji';line-height:1;white-space:nowrap}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg" stdDeviation="0 0" edgeMode="duplicate"/></filter></svg>

</body></html>
